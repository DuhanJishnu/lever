[project]
name = "lever"
version = "0.1.0"
description = "Lever: coding-agent harness that makes a cheap model perform like a stronger one"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sse-starlette>=2.1",
  "google-genai>=1.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.11",
]

[project.scripts]
lever = "lever.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lever"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["evals/tasks"]  # task repos intentionally contain bugs (the bugs ARE the tasks)

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
